backend:
  name: git-gateway
  branch: main # Branch to update (optional; defaults to master)

media_folder: "images" # Media files will be stored in the repo under images/
public_folder: "/images" # The src attribute for uploaded media will begin with /images/

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - file: "data/settings.json"
        name: "settings"
        label: "Site Settings"
        fields:
          - {label: "Logo", name: "logo", widget: "image", required: false}
          - {label: "Business Name", name: "business_name", widget: "string"}
          - {label: "Phone", name: "phone", widget: "string"}
          - {label: "Facebook URL", name: "facebook_url", widget: "string"}

  - name: "hero"
    label: "Hero Section"
    files:
      - file: "data/hero.json"
        name: "hero"
        label: "Hero Section"
        fields:
          - {label: "Headline White", name: "headline_white", widget: "string"}
          - {label: "Headline Yellow", name: "headline_yellow", widget: "string"}
          - {label: "Description", name: "description", widget: "text"}
          - {label: "Primary Button Text", name: "primary_button", widget: "string"}
          - {label: "Secondary Button Text", name: "secondary_button", widget: "string"}
          - {label: "Background Image", name: "background_image", widget: "image"}
          - {label: "Overlay Opacity", name: "overlay_opacity", widget: "number", value_type: "float", min: 0, max: 1, step: 0.01}

  - name: "services"
    label: "Services"
    files:
      - file: "data/services.json"
        name: "services"
        label: "Services"
        fields:
          - {label: "Heading", name: "heading", widget: "string"}
          - label: "Services List"
            name: "services"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}

  - name: "gallery"
    label: "Gallery Pages"
    files:
      - file: "data/gallery.json"
        name: "gallery"
        label: "Gallery Pages"
        fields:
          - {label: "Homepage Heading", name: "homepage_heading", widget: "string"}
          - {label: "Homepage Button Text", name: "homepage_button", widget: "string"}
          - {label: "Gallery Page Heading", name: "page_heading", widget: "string"}
          - {label: "Gallery Page Intro", name: "page_intro", widget: "text"}
          - label: "Categories"
            name: "categories"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Show on Homepage", name: "show_on_homepage", widget: "boolean"}
              - label: "Photos"
                name: "photos"
                widget: "list"
                fields:
                  - {label: "Image", name: "image", widget: "image"}
                  - {label: "Tag (e.g. AFTER)", name: "tag", widget: "string", required: false}
                  - {label: "Alt Text", name: "alt", widget: "string"}

  - name: "estimate"
    label: "Estimate Section"
    files:
      - file: "data/estimate.json"
        name: "estimate"
        label: "Estimate Section"
        fields:
          - {label: "Heading", name: "heading", widget: "string"}
          - {label: "Button Text", name: "button_text", widget: "string"}
