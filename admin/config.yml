backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "logo"
    label: "Website Logo"
    description: "Upload your business logo. It displays as a small circle in the top-left corner of the header."
    editor: {preview: false}
    files:
      - file: "data/settings.json"
        label: "Header Logo"
        name: "logo_file"
        fields:
          - {label: "Logo Image (Top-Left Circle)", name: "logo", widget: "image", required: false, hint: "Upload your logo here. It will be shown inside the small circle in the top-left corner of the header on all pages."}
          - {label: "Business Name", name: "business_name", widget: "hidden"}
          - {label: "Phone Number", name: "phone", widget: "hidden"}
          - {label: "Facebook Page Link", name: "facebook_url", widget: "hidden"}

  - name: "business_info"
    label: "Business & Contact Info"
    description: "Edit your business name, phone number, and social media links."
    editor: {preview: false}
    files:
      - file: "data/settings.json"
        label: "Contact Details"
        name: "contact_file"
        fields:
          - {label: "Logo", name: "logo", widget: "hidden"}
          - {label: "Business Name", name: "business_name", widget: "string", hint: "Shown next to the circular logo in the top-left header."}
          - {label: "Phone Number", name: "phone", widget: "string", hint: "Used by the green Call Now button, e.g. 262-443-1199."}
          - {label: "Facebook Page Link", name: "facebook_url", widget: "string", required: false, hint: "Full link to your Facebook page. Leave blank to hide the Facebook button."}

  - name: "banner"
    label: "Top Banner (Hero)"
    description: "Edit the main headline and buttons at the top of the homepage."
    editor: {preview: false}
    files:
      - file: "data/hero.json"
        label: "Headline & Buttons"
        name: "hero"
        fields:
          - {label: "Headline – White Line", name: "headline_white", widget: "string"}
          - {label: "Headline – Yellow Line", name: "headline_yellow", widget: "string"}
          - {label: "Description", name: "description", widget: "text"}
          - {label: "Yellow Button Text", name: "primary_button", widget: "string", hint: "Jumps to the estimate form."}
          - {label: "Outline Button Text", name: "secondary_button", widget: "string", hint: "Opens the Photo Gallery page."}

  - name: "services_section"
    label: "Services (What We Do)"
    description: "Edit the list of painting and repair services."
    editor: {preview: false}
    files:
      - file: "data/services.json"
        label: "Services List"
        name: "services"
        fields:
          - {label: "Section Heading", name: "heading", widget: "string"}
          - label: "Services"
            label_singular: "Service"
            name: "services"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Service Name", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}

  - name: "photos"
    label: "Project Photos (Gallery)"
    description: "Manage project photo categories, photos, and BEFORE / AFTER tags."
    editor: {preview: false}
    files:
      - file: "data/gallery.json"
        label: "Project Photos"
        name: "gallery"
        fields:
          - {label: "Homepage Section Heading", name: "homepage_heading", widget: "string"}
          - {label: "Homepage Button Text", name: "homepage_button", widget: "string"}
          - {label: "Gallery Page Heading", name: "page_heading", widget: "string"}
          - {label: "Gallery Page Intro", name: "page_intro", widget: "text", required: false}
          - label: "Categories"
            label_singular: "Category"
            name: "categories"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Category Name", name: "title", widget: "string", hint: "e.g. Kitchen Painting, Decks, Drywall"}
              - {label: "Show on homepage", name: "show_on_homepage", widget: "boolean", default: true}
              - label: "Photos"
                label_singular: "Photo"
                name: "photos"
                widget: "list"
                summary: "{{fields.tag}} {{fields.image}}"
                fields:
                  - {label: "Photo", name: "image", widget: "image"}
                  - {label: "Tag", name: "tag", widget: "string", required: false, hint: "Optional label, e.g. BEFORE, AFTER, DURING (MUD & TAPE)."}
                  - {label: "Short Description", name: "alt", widget: "string", required: false}
