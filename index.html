    <style>
:root {
    --primary: #ffcc00;
    --bg: #111111;
    --text: #ffffff;
    --card-bg: #1a1a1a;
}

body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }

/* HEADER - LOGO IN TOP-LEFT CORNER */
header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    border-bottom: 1px solid #282828;
    background: #111111;
    position: sticky;
    top: 0;
    z-index: 50;
    gap: 16px;
}
.logo-row {
    display: flex;
    align-items: center;
    justify-content: flex-start;
}
.logo-row a {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
}
.logo-circle {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 2px solid var(--primary);
    background: #1c1c1c;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 0 8px rgba(255, 204, 0, 0.25);
}
.logo-circle img.logo-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    display: block;
}
.logo-circle img[hidden] {
    display: none;
}
.logo-fallback {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 30% 30%, #2a2a2a, #141414);
}
.logo-fallback[hidden] {
    display: none;
}
.logo-monogram {
    font-size: 0.95rem;
    font-weight: 900;
    letter-spacing: 0.5px;
    color: var(--primary);
    line-height: 1;
}
.logo-row h1 {
    font-size: 1.15rem;
    color: var(--primary);
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 800;
}
.nav-links {
    display: flex;
    align-items: center;
    gap: 22px;
    font-size: 0.9rem;
    font-weight: 700;
}
.nav-links a {
    color: var(--text);
    text-decoration: none;
    text-transform: capitalize;
    transition: color 0.15s;
}
.nav-links a:hover {
    color: var(--primary);
}
