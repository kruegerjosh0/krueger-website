<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Krueger Painting OS</title>
    <meta name="description" content="Professional contractor operating system for Krueger Painting featuring PDF estimates and bills, GPS and searchable weather hub, scheduling, client CRM, and field tools." />
    <meta property="og:title" content="Krueger Painting OS" />
    <meta property="og:description" content="Professional contractor operating system for Krueger Painting featuring PDF estimates and bills, GPS and searchable weather hub, scheduling, client CRM, and field tools." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#231709" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KruegerOS" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
      :root {
        --bg-main: #111418;
        --card-bg: #1b2026;
        --primary: #ffcc00;
        --text-main: #ffffff;
        --text-muted: #99a2ad;
        --border-color: #2d3540;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg-main);
        color: var(--text-main);
        line-height: 1.5;
      }
      .os-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
        box-sizing: border-box;
      }
      .os-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 16px;
        margin-bottom: 24px;
      }
      .os-title {
        color: var(--primary);
        font-size: 1.4rem;
        font-weight: 900;
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .os-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      }
      .btn-primary {
        background: var(--primary);
        color: #000000;
        border: none;
        padding: 12px 20px;
        font-weight: 900;
        border-radius: 4px;
        text-transform: uppercase;
        cursor: pointer;
        font-size: 0.9rem;
      }
      .form-control {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        background: #111418;
        border: 1px solid var(--border-color);
        color: #fff;
        font-size: 1rem;
        border-radius: 4px;
        margin-bottom: 16px;
      }
      label {
        color: var(--primary);
        display: block;
        margin-bottom: 6px;
        font-size: 0.85rem;
        font-weight: 800;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="os-container">
      <header class="os-header">
        <h1 class="os-title">Krueger Painting OS</h1>
        <div style="font-size: 0.85rem; color: var(--text-muted);">Secure Field & Estimator Hub</div>
      </header>

      <!-- ESTIMATOR & CRM DASHBOARD -->
      <main>
        <div class="os-card">
          <h2 style="color: var(--primary); margin-top: 0; font-size: 1.2rem;">Quick Project Estimator & Client CRM</h2>
          <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">
            Manage painting specs, calculate material totals, and generate professional estimates instantly.
          </p>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div>
              <label>Client Name</label>
              <input type="text" id="crm-client-name" class="form-control" placeholder="e.g. John Miller">
            </div>
            <div>
              <label>Project Title</label>
              <input type="text" id="crm-project-title" class="form-control" placeholder="e.g. Interior Main Floor">
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div>
              <label>Wall Square Footage</label>
              <input type="number" id="calc-sqft" class="form-control" placeholder="Enter total sq ft">
            </div>
            <div>
              <label>Paint Product Rate ($/gal)</label>
              <input type="number" id="calc-rate" class="form-control" value="65">
            </div>
          </div>

          <button type="button" class="btn-primary" onclick="runQuickEstimate()">Calculate Estimate Total</button>
          
          <div id="estimate-result-box" style="margin-top: 20px; padding: 15px; background: #111418; border-radius: 6px; display: none;">
            <strong style="color: var(--primary);">Estimated Total:</strong> <span id="output-total" style="font-size: 1.2rem; font-weight: 800; color: #fff;">$0.00</span>
          </div>
        </div>
      </main>
    </div>

    <script>
      function runQuickEstimate() {
        const sqft = parseFloat(document.getElementById('calc-sqft').value) || 0;
        const rate = parseFloat(document.getElementById('calc-rate').value) || 65;
        // Standard coverage calculation approx 350 sq ft per gallon with 2 coats
        const gallons = Math.ceil((sqft * 2) / 350);
        const materialCost = gallons * rate;
        const laborCost = sqft * 1.75; // Standard contractor labor estimate baseline
        const total = materialCost + laborCost;

        const resultBox = document.getElementById('estimate-result-box');
        const outputTotal = document.getElementById('output-total');
        outputTotal.textContent = "$" + total.toFixed(2) + " (" + gallons + " gallons estimated)";
        resultBox.style.display = 'block';
      }
    </script>
  </body>
</html>
