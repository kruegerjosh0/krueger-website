Media:
  input: images
  output: /images

content:
  - name: settings
    label: Business & Settings
    description: Edit your business name, phone number, logo, and social links.
    type: file
    file: data/settings.json
    fields:
      - label: Logo Image (Top-Left Circle)
        name: logo
        type: image
        required: false
      - label: Business Name
        name: business_name
        type: string
      - label: Phone Number
        name: phone
        type: string
      - label: Facebook Page Link
        name: facebook_url
        type: string
        required: false

  - name: banner
    label: Top Banner (Hero)
    description: Edit the main headline and buttons at the top of the homepage.
    type: file
    file: data/hero.json
    fields:
      - label: Headline – White Line
        name: headline_white
        type: string
      - label: Headline – Yellow Line
        name: headline_yellow
        type: string
      - label: Description
        name: description
        type: text
      - label: Background Image
        name: background_image
        type: image
        required: false
      - label: Yellow Button Text
        name: primary_button
        type: string
      - label: Outline Button Text
        name: secondary_button
        type: string

  - name: services
    label: Services
    description: Manage your painting services list.
    type: file
    file: data/services.json
    fields:
      - label: Section Heading
        name: heading
        type: string

  - name: gallery
    label: Gallery & Photos
    description: Manage your homepage and gallery headings.
    type: file
    file: data/gallery.json
    fields:
      - label: Homepage Section Heading
        name: homepage_heading
        type: string
      - label: Homepage Button Text
        name: homepage_button
        type: string
      - label: Gallery Page Heading
        name: page_heading
        type: string
      - label: Gallery Page Intro
        name: page_intro
        type: text
        required: false
