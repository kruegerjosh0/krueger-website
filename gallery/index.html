<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery | Krueger Painting</title>
    <meta name="description" content="Browse our interior painting, drywall repairs, and exterior finish projects.">
    <meta property="og:title" content="Photo Gallery | Krueger Painting">
    <meta property="og:description" content="Browse our interior painting, drywall repairs, and exterior finish projects.">

    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header>
        <div class="logo-row">
            <a href="/">
                <div class="logo-circle">
                    <img src="" alt="Krueger Painting logo" class="logo-img" data-cms-src="settings.logo" hidden>
                    <div class="logo-fallback" aria-label="Krueger Painting">
                        <span class="logo-monogram">KP</span>
                    </div>
                </div>
                <h1 data-cms="settings.business_name">Krueger Painting</h1>
            </a>
        </div>
        <div class="nav-links">
            <a href="/#services">Services</a>
            <a href="/gallery/">Gallery</a>
            <a href="/#estimate">Request Estimate</a>
        </div>
        <div class="action-buttons">
            <a href="tel:262-443-1199" class="btn-call" aria-label="Call Krueger Painting">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1 1 0 011.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.25 1.02l-2.2 2.2z"/>
                </svg>
                <span>Call Now</span>
            </a>
            <a href="https://www.facebook.com/share/1EySXfm7FM/" target="_blank" rel="noopener" class="btn-fb" aria-label="Krueger Painting on Facebook">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
                <span>Facebook</span>
            </a>
        </div>
    </header>

    <section class="container">
        <div class="section-title">
            <h3>Photo Gallery</h3>
            <div class="underline"></div>
        </div>
        <p class="page-intro">Browse our interior painting, drywall repairs, and exterior finish projects.</p>

        <!-- Filled from the Photo Gallery in the admin page -->
        <div id="filter-bar" class="filter-bar"></div>
        <div id="photo-grid" class="photo-grid"></div>

        <div style="text-align: center; margin-top: 40px;">
            <a href="/#estimate" class="btn-primary" style="margin: 0 auto;">Tap for Free Estimate</a>
        </div>
    </section>

    <div id="lightbox" class="lightbox" hidden>
        <button type="button" aria-label="Close">&times;</button>
        <img src="" alt="">
        <p></p>
    </div>

    <footer>
        <p class="footer-address"><strong>Mailing Address:</strong> N630 Moraine Dr., Campbellsport, WI 53010</p>
        <p class="footer-phone"><strong>Phone:</strong> <a href="tel:262-443-1199">262-443-1199</a></p>
        <a href="/admin/" class="admin-link">Admin Login</a>
    </footer>

    <script src="/js/site.js"></script>

<script>
  async function loadData() {
    try {
      const [settingsRes, galleryRes] = await Promise.all([
        fetch('../data/settings.json'),
        fetch('../data/gallery.json')
      ]);

      const siteData = {
        settings: await settingsRes.json(),
        gallery: await galleryRes.json()
      };

      // --- RENDER LOGIC ---
      // Business Name & Logo
      const name = siteData.settings.business_name || "Krueger Painting";
      document.getElementById("header-business-name").textContent = name;
      document.title = name + " | Photo Gallery";

      if (siteData.settings.logo) {
          const topLogo = document.getElementById("admin-top-logo");
          if(topLogo) { topLogo.src = siteData.settings.logo; topLogo.hidden = false; }
          const topFb = document.getElementById("admin-top-fallback");
          if(topFb) topFb.hidden = true;

          const circs = document.querySelectorAll(".logo-circle");
          circs.forEach(c => {
              c.style.backgroundImage = `url(${siteData.settings.logo})`;
              c.style.backgroundSize = "cover";
              c.style.backgroundPosition = "center";
          });
      }

      // Contact Details
      if (siteData.settings.phone) {
          document.querySelectorAll(".btn-call").forEach(btn => {
              btn.textContent = "Call " + siteData.settings.phone;
              btn.href = "tel:" + siteData.settings.phone;
          });
      }
      if (siteData.settings.facebook_url) {
          const btn = document.getElementById("btn-facebook");
          if (btn) {
              btn.href = siteData.settings.facebook_url;
              btn.hidden = false;
          }
      }
      if (siteData.settings.footer_text) {
          const ft = document.getElementById("footer-text");
          if (ft) ft.textContent = siteData.settings.footer_text;
      }

      // Gallery Page Filter Logic
      if (siteData.gallery) {
          const filterBar = document.getElementById("filter-bar");
          const fullGrid = document.getElementById("photo-grid");
          const lightbox = document.getElementById("lightbox");
          const lbImg = document.getElementById("lightbox-img");
          const lbTxt = document.getElementById("lightbox-caption");
          const lbClose = document.getElementById("lightbox-close-btn");

          if (siteData.gallery.page_heading) {
              const ph = document.getElementById("gallery-page-heading");
              if (ph) ph.textContent = siteData.gallery.page_heading;
          }
          if (siteData.gallery.page_intro) {
              const pi = document.getElementById("gallery-page-intro");
              if (pi) pi.textContent = siteData.gallery.page_intro;
          }

          if (filterBar && fullGrid && Array.isArray(siteData.gallery.categories)) {
              let currentFilter = 'All';

              function renderGalleryPage() {
                  filterBar.innerHTML = "";
                  fullGrid.innerHTML = "";

                  // Filter buttons
                  const allBtn = document.createElement("button");
                  allBtn.className = "filter-btn " + (currentFilter === 'All' ? 'active' : '');
                  allBtn.textContent = "All";
                  allBtn.onclick = () => { currentFilter = 'All'; renderGalleryPage(); };
                  filterBar.appendChild(allBtn);

                  siteData.gallery.categories.forEach(cat => {
                      const btn = document.createElement("button");
                      btn.className = "filter-btn " + (currentFilter === cat.title ? 'active' : '');
                      btn.textContent = cat.title;
                      btn.onclick = () => { currentFilter = cat.title; renderGalleryPage(); };
                      filterBar.appendChild(btn);
                  });

                  // Photos
                  let empty = true;
                  siteData.gallery.categories.forEach(cat => {
                      if (currentFilter !== 'All' && currentFilter !== cat.title) return;
                      if (!Array.isArray(cat.photos)) return;

                      cat.photos.forEach(photo => {
                          if (!photo.image) return;
                          empty = false;
                          const div = document.createElement("div");
                          div.className = "photo-tile";

                          if (photo.tag) {
                              const tag = document.createElement("span");
                              tag.className = "tag-badge";
                              tag.textContent = photo.tag;
                              div.appendChild(tag);
                          }

                          const img = document.createElement("img");
                          img.src = photo.image;
                          if (photo.alt) img.alt = photo.alt;
                          img.loading = "lazy";

                          div.onclick = () => {
                              if (!lightbox) return;
                              lbImg.src = photo.image;
                              lbTxt.textContent = photo.alt || "";
                              lightbox.hidden = false;
                          };

                          div.appendChild(img);
                          fullGrid.appendChild(div);
                      });
                  });

                  if (empty) {
                      const em = document.createElement("p");
                      em.className = "empty-note";
                      em.textContent = "No photos added to this category yet.";
                      fullGrid.appendChild(em);
                  }
              }

              if (lbClose) {
                  lbClose.onclick = () => lightbox.hidden = true;
              }
              if (lightbox) {
                  lightbox.onclick = (e) => {
                      if (e.target === lightbox) lightbox.hidden = true;
                  };
              }

              renderGalleryPage();
          }
      }

    } catch (e) {
      console.error("Error loading CMS data:", e);
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('year-copy').textContent = new Date().getFullYear();
      loadData();
  });
</script>
</body>
</html>
